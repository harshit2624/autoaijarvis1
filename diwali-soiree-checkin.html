<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gate Check-In — Diwali Soiree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#140607; --card:#1d0c0d; --border:rgba(176,138,75,.2); --border-strong:rgba(176,138,75,.45);
  --text:#f3ebdd; --muted:#9a8e7c; --gold:#b08a4b; --gold-bright:#d4b579;
  --ok:#5fc98d; --ok-bg:rgba(95,201,141,.1); --warn:#e0a94a; --warn-bg:rgba(224,169,74,.12); --err:#d9736a; --err-bg:rgba(217,115,106,.1);
}
/* Fixed app-like shell — html stays pinned, body is the only scroll
   container. Without this, mobile browsers (Safari/Chrome) resize the
   viewport and let the page rubber-band/bounce as the address bar
   shows/hides or on any touch-scroll, which reads as the whole page
   "shaking" instead of a stable native-feeling screen. */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;touch-action:pan-y;-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--text);font-family:'Jost',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'Bodoni Moda',serif}
.wrap{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.header{position:relative;text-align:center;padding:16px 0 28px;border-bottom:1px solid var(--border);margin-bottom:28px}
.header b{display:block;font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.header span{display:block;font-size:13px;color:var(--muted);margin-top:8px}
.back-link{position:absolute;left:0;top:2px;font-size:10px;letter-spacing:.1em;color:var(--muted);text-decoration:none;text-transform:uppercase;display:none}
.back-link.show{display:block}

/* Login gate */
#login-screen{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.inp{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:16px 2px;font-size:16px;color:var(--text);outline:none;font-family:inherit;text-align:center}
.inp:focus{border-color:var(--gold)}
.btn{width:100%;background:transparent;color:var(--gold-bright);border:1px solid var(--gold);padding:15px;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.btn:active{background:var(--gold);color:var(--bg)}

/* Scan state — real camera viewfinder */
#scan-screen{display:none;flex:1;flex-direction:column;gap:16px}
#qr-video-box{width:100%;aspect-ratio:1;border:1px solid var(--border-strong);overflow:hidden;position:relative;background:#000}
#qr-video-box video{width:100%!important;height:100%!important;object-fit:cover}
/* html5-qrcode injects its own canvas/region overlay; keep our border styling, strip its default UI chrome */
#qr-reader{width:100%;height:100%}
#qr-reader img{display:none!important}
#qr-reader__dashboard{display:none!important}
.scan-frame{position:absolute;inset:16%;border:1.5px solid var(--gold);pointer-events:none}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;width:18px;height:18px;border:2px solid var(--gold-bright)}
.scan-frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.scan-frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.scan-hint{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6}
.cam-err{font-size:12px;color:var(--err);text-align:center;display:none}
.manual-entry{margin-top:4px;width:100%;display:flex;flex-direction:column;gap:10px}
.manual-entry .inp{font-size:14px;letter-spacing:.05em}
.divider-text{text-align:center;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:4px 0}

/* Result card */
#result-screen{display:none;flex:1;flex-direction:column;gap:18px}
.result-card{border:1px solid var(--border-strong);padding:24px;text-align:center}
.result-card.ok{border-color:var(--ok)}
.result-card.warn{border-color:var(--warn)}
.result-card.err{border-color:var(--err)}
.result-status{font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:6px 14px;display:inline-block;margin-bottom:16px}
.result-status.ok{background:var(--ok-bg);color:var(--ok)}
.result-status.warn{background:var(--warn-bg);color:var(--warn)}
.result-status.err{background:var(--err-bg);color:var(--err)}
.result-name{font-family:'Bodoni Moda',serif;font-size:24px;margin-bottom:6px}
.result-detail{font-size:12.5px;color:var(--muted);line-height:1.8}
.result-detail b{color:var(--text);font-weight:500}
.btn-mark{width:100%;background:var(--gold);color:var(--bg);border:none;padding:16px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;margin-top:4px}
.btn-mark:disabled{opacity:.4;cursor:not-allowed}
.btn-scan-next{width:100%;background:transparent;border:1px solid var(--border-strong);color:var(--text);padding:15px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.err-msg{font-size:12px;color:var(--err);text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <a class="back-link" id="back-link" href="/diwali-soiree/admin">&larr; Admin</a>
    <b>Diwali Soiree 2.0</b>
    <span>Gate Check-In</span>
  </div>

  <div id="login-screen">
    <input class="inp" id="pw" type="password" placeholder="Gate Password" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">Unlock Scanner</button>
    <div class="err-msg" id="login-err"></div>
  </div>

  <div id="scan-screen">
    <div id="qr-video-box">
      <div id="qr-reader"></div>
      <div class="scan-frame"></div>
    </div>
    <div class="scan-hint">Hold the guest's QR code inside the frame — it scans automatically.</div>
    <div class="cam-err" id="cam-err"></div>
    <div class="divider-text">— or —</div>
    <div class="manual-entry">
      <input class="inp" id="manual-id" type="text" placeholder="DS2-XXXXXXXX" autocapitalize="characters">
      <button class="btn" onclick="lookupManual()">Look Up Ticket ID</button>
    </div>
  </div>

  <div id="result-screen"></div>
</div>

<script>
function getToken() { try { return localStorage.getItem('ds_scan_token') || ''; } catch (e) { return ''; } }
function setToken(t) { try { localStorage.setItem('ds_scan_token', t); } catch (e) {} }
function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

var pendingIdFromQr = new URLSearchParams(location.search).get('id');
// Only show "Back to Admin" if we actually arrived from the dashboard
// (its Scan Ticket link appends ?from=admin) — never when staff opened
// this page directly or via a scanned ticket QR.
if (new URLSearchParams(location.search).get('from') === 'admin') {
  document.getElementById('back-link').classList.add('show');
}

function doLogin() {
  var pw = document.getElementById('pw').value;
  if (!pw) return;
  fetch('/event/diwali-soiree/gate-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.token) throw new Error(d.error || 'Login failed');
      setToken(d.token);
      if (pendingIdFromQr) { showResultScreen(); lookupTicket(pendingIdFromQr); pendingIdFromQr = null; }
      else showScanScreen();
    })
    .catch(function (e) { document.getElementById('login-err').textContent = e.message || 'Incorrect password'; });
}

var html5QrCode = null;
var scannerRunning = false;

function showScanScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('scan-screen').style.display = 'flex';
  startCamera();
}

function showResultScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('scan-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'flex';
  stopCamera();
}

function startCamera() {
  if (scannerRunning || typeof Html5Qrcode === 'undefined') return;
  document.getElementById('cam-err').style.display = 'none';
  html5QrCode = new Html5Qrcode('qr-reader', { verbose: false });
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1 },
    function (decodedText) { onScanSuccess(decodedText); },
    function () { /* per-frame no-QR-found noise, ignore */ }
  ).then(function () { scannerRunning = true; })
   .catch(function (e) {
     var el = document.getElementById('cam-err');
     el.style.display = 'block';
     el.textContent = 'Camera unavailable — use manual entry below (' + (e && e.message ? e.message : 'permission denied') + ')';
   });
}

function stopCamera() {
  if (html5QrCode && scannerRunning) {
    html5QrCode.stop().then(function () { html5QrCode.clear(); scannerRunning = false; }).catch(function () { scannerRunning = false; });
  }
}

function onScanSuccess(decodedText) {
  var id = decodedText;
  try {
    var u = new URL(decodedText);
    var qId = u.searchParams.get('id');
    if (qId) id = qId;
  } catch (e) { /* not a URL — treat raw text as the ticket id */ }
  showResultScreen();
  lookupTicket(id);
}

function lookupManual() {
  var id = document.getElementById('manual-id').value.trim().toUpperCase();
  if (id) { showResultScreen(); lookupTicket(id); }
}

function lookupTicket(ticketId) {
  fetch('/admin/diwali-tickets/lookup/' + encodeURIComponent(ticketId), { headers: authHeaders() })
    .then(function (r) {
      if (r.status === 401 || r.status === 403) { setToken(''); showLoginScreen('Session expired — log in again'); throw new Error('auth'); }
      return r.json();
    })
    .then(function (d) {
      if (d.error) return renderResult({ title: 'Not Found', detail: 'No ticket matches ' + ticketId });
      renderTicketCard(d.ticket);
    })
    .catch(function () {});
}

function renderTicketCard(t) {
  var screen = document.getElementById('result-screen');
  var isUsed = t.checked_in;
  screen.innerHTML =
    '<div class="result-card ' + (isUsed ? 'warn' : 'ok') + '">' +
      '<span class="result-status ' + (isUsed ? 'warn' : 'ok') + '">' + (isUsed ? 'Already Used' : 'Valid Ticket') + '</span>' +
      '<div class="result-name serif">' + escapeHtml(t.name || 'Guest') + '</div>' +
      '<div class="result-detail">' +
        '<b>' + escapeHtml(t.tier_label || '') + '</b> · ₹' + t.amount + '<br>' +
        'Phone: ' + escapeHtml(t.phone || '-') + '<br>' +
        'Ticket: ' + escapeHtml(t.ticket_id) +
        (isUsed ? '<br><br>Entered at ' + new Date(t.checked_in_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '') +
      '</div>' +
    '</div>' +
    (isUsed ? '' : '<button class="btn-mark" id="mark-btn" onclick="markEntered(\'' + t.ticket_id + '\')">Mark Entered</button>') +
    '<button class="btn-scan-next" onclick="showScanScreen()">Scan Next</button>';
}

function renderResult(opts) {
  var screen = document.getElementById('result-screen');
  screen.innerHTML =
    '<div class="result-card err">' +
      '<span class="result-status err">' + escapeHtml(opts.title) + '</span>' +
      '<div class="result-detail">' + escapeHtml(opts.detail) + '</div>' +
    '</div>' +
    '<button class="btn-scan-next" onclick="showScanScreen()">Scan Next</button>';
}

function markEntered(ticketId) {
  var btn = document.getElementById('mark-btn');
  btn.disabled = true; btn.textContent = 'Marking…';
  fetch('/admin/diwali-tickets/' + encodeURIComponent(ticketId) + '/check-in', { method: 'POST', headers: authHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      renderTicketCard(d.ticket);
    })
    .catch(function (e) { alert(e.message || 'Failed to mark entered'); btn.disabled = false; btn.textContent = 'Mark Entered'; });
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function showLoginScreen(msg) {
  stopCamera();
  document.getElementById('scan-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  if (msg) document.getElementById('login-err').textContent = msg;
}

(function () {
  if (getToken()) {
    if (pendingIdFromQr) { showResultScreen(); lookupTicket(pendingIdFromQr); pendingIdFromQr = null; }
    else showScanScreen();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
  }
})();
</script>
</body>
</html>
