<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gate Check-In — Diwali Soiree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#140607; --card:#1d0c0d; --border:rgba(176,138,75,.2); --border-strong:rgba(176,138,75,.45);
  --text:#f3ebdd; --muted:#9a8e7c; --gold:#b08a4b; --gold-bright:#d4b579;
  --ok:#5fc98d; --ok-bg:rgba(95,201,141,.1); --warn:#e0a94a; --warn-bg:rgba(224,169,74,.12); --err:#d9736a; --err-bg:rgba(217,115,106,.1);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Jost',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'Bodoni Moda',serif}
.wrap{max-width:420px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.header{text-align:center;padding:16px 0 28px;border-bottom:1px solid var(--border);margin-bottom:28px}
.header b{display:block;font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.header span{display:block;font-size:13px;color:var(--muted);margin-top:8px}

/* Login gate */
#login-screen{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.inp{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:16px 2px;font-size:16px;color:var(--text);outline:none;font-family:inherit;text-align:center}
.inp:focus{border-color:var(--gold)}
.btn{width:100%;background:transparent;color:var(--gold-bright);border:1px solid var(--gold);padding:15px;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.btn:active{background:var(--gold);color:var(--bg)}

/* Scan state */
#scan-screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.scan-icon{opacity:.5}
.scan-hint{font-size:13px;color:var(--muted);max-width:260px;line-height:1.7}
.manual-entry{margin-top:20px;width:100%;display:flex;flex-direction:column;gap:10px}
.manual-entry .inp{font-size:14px;letter-spacing:.05em}

/* Result card */
#result-screen{display:none;flex:1;flex-direction:column;gap:18px}
.result-card{border:1px solid var(--border-strong);padding:24px;text-align:center}
.result-card.ok{border-color:var(--ok)}
.result-card.warn{border-color:var(--warn)}
.result-card.err{border-color:var(--err)}
.result-status{font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:6px 14px;display:inline-block;margin-bottom:16px}
.result-status.ok{background:var(--ok-bg);color:var(--ok)}
.result-status.warn{background:var(--warn-bg);color:var(--warn)}
.result-status.err{background:var(--err-bg);color:var(--err)}
.result-name{font-family:'Bodoni Moda',serif;font-size:24px;margin-bottom:6px}
.result-detail{font-size:12.5px;color:var(--muted);line-height:1.8}
.result-detail b{color:var(--text);font-weight:500}
.btn-mark{width:100%;background:var(--gold);color:var(--bg);border:none;padding:16px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;margin-top:4px}
.btn-mark:disabled{opacity:.4;cursor:not-allowed}
.btn-scan-next{width:100%;background:transparent;border:1px solid var(--border-strong);color:var(--text);padding:15px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.err-msg{font-size:12px;color:var(--err);text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <b>Diwali Soiree 2.0</b>
    <span>Gate Check-In</span>
  </div>

  <div id="login-screen">
    <input class="inp" id="pw" type="password" placeholder="Admin Password" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">Unlock Scanner</button>
    <div class="err-msg" id="login-err"></div>
  </div>

  <div id="scan-screen">
    <svg class="scan-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d4b579" stroke-width="1.3"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 18h2M18 14h3"/></svg>
    <div class="scan-hint">Point your camera app at the guest's QR code — it opens this page automatically. Or enter their ticket ID below.</div>
    <div class="manual-entry">
      <input class="inp" id="manual-id" type="text" placeholder="DS2-XXXXXXXX" autocapitalize="characters">
      <button class="btn" onclick="lookupManual()">Look Up</button>
    </div>
  </div>

  <div id="result-screen"></div>
</div>

<script>
var API = '';
function getToken() { try { return localStorage.getItem('ds_gate_token') || ''; } catch (e) { return ''; } }
function setToken(t) { try { localStorage.setItem('ds_gate_token', t); } catch (e) {} }

function doLogin() {
  var pw = document.getElementById('pw').value;
  if (!pw) return;
  fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.token) throw new Error(d.error || 'Login failed');
      setToken(d.token);
      showScanScreen();
    })
    .catch(function (e) { document.getElementById('login-err').textContent = e.message || 'Incorrect password'; });
}

function showScanScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('scan-screen').style.display = 'flex';
}

function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

function lookupManual() {
  var id = document.getElementById('manual-id').value.trim().toUpperCase();
  if (id) lookupTicket(id);
}

function lookupTicket(ticketId) {
  fetch('/admin/diwali-tickets/lookup/' + encodeURIComponent(ticketId), { headers: authHeaders() })
    .then(function (r) {
      if (r.status === 401 || r.status === 403) { setToken(''); showLoginScreen('Session expired — log in again'); throw new Error('auth'); }
      return r.json();
    })
    .then(function (d) {
      if (d.error) return renderResult({ err: true, title: 'Not Found', detail: 'No ticket matches ' + ticketId });
      renderTicketCard(d.ticket);
    })
    .catch(function () {});
}

function renderTicketCard(t) {
  document.getElementById('scan-screen').style.display = 'none';
  var screen = document.getElementById('result-screen');
  screen.style.display = 'flex';
  var isUsed = t.checked_in;
  screen.innerHTML =
    '<div class="result-card ' + (isUsed ? 'warn' : 'ok') + '">' +
      '<span class="result-status ' + (isUsed ? 'warn' : 'ok') + '">' + (isUsed ? 'Already Used' : 'Valid Ticket') + '</span>' +
      '<div class="result-name serif">' + escapeHtml(t.name || 'Guest') + '</div>' +
      '<div class="result-detail">' +
        '<b>' + escapeHtml(t.tier_label || '') + '</b> · ₹' + t.amount + '<br>' +
        'Phone: ' + escapeHtml(t.phone || '-') + '<br>' +
        'Ticket: ' + escapeHtml(t.ticket_id) +
        (isUsed ? '<br><br>Entered at ' + new Date(t.checked_in_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '') +
      '</div>' +
    '</div>' +
    (isUsed ? '' : '<button class="btn-mark" id="mark-btn" onclick="markEntered(\'' + t.ticket_id + '\')">Mark Entered</button>') +
    '<button class="btn-scan-next" onclick="showScanScreen()">Scan Next</button>';
}

function renderResult(opts) {
  document.getElementById('scan-screen').style.display = 'none';
  var screen = document.getElementById('result-screen');
  screen.style.display = 'flex';
  screen.innerHTML =
    '<div class="result-card err">' +
      '<span class="result-status err">' + escapeHtml(opts.title) + '</span>' +
      '<div class="result-detail">' + escapeHtml(opts.detail) + '</div>' +
    '</div>' +
    '<button class="btn-scan-next" onclick="showScanScreen()">Scan Next</button>';
}

function markEntered(ticketId) {
  var btn = document.getElementById('mark-btn');
  btn.disabled = true; btn.textContent = 'Marking…';
  fetch('/admin/diwali-tickets/' + encodeURIComponent(ticketId) + '/check-in', { method: 'POST', headers: authHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      renderTicketCard(d.ticket);
    })
    .catch(function (e) { alert(e.message || 'Failed to mark entered'); btn.disabled = false; btn.textContent = 'Mark Entered'; });
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function showLoginScreen(msg) {
  document.getElementById('scan-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  if (msg) document.getElementById('login-err').textContent = msg;
}

// Boot: if ?id= is in the URL (QR scanned), go straight to lookup once
// authenticated; otherwise show the scan/manual-entry screen.
(function () {
  var params = new URLSearchParams(location.search);
  var idFromQr = params.get('id');
  if (getToken()) {
    if (idFromQr) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('scan-screen').style.display = 'none'; document.getElementById('result-screen').style.display = 'flex'; lookupTicket(idFromQr); }
    else { showScanScreen(); }
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    if (idFromQr) {
      // Stash it so login flows straight into the lookup
      window.__pendingId = idFromQr;
      var origLogin = doLogin;
      doLogin = function () {
        var pw = document.getElementById('pw').value;
        if (!pw) return;
        fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.token) throw new Error(d.error || 'Login failed');
            setToken(d.token);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            lookupTicket(window.__pendingId);
          })
          .catch(function (e) { document.getElementById('login-err').textContent = e.message || 'Incorrect password'; });
      };
    }
  }
})();
</script>
</body>
</html>
