<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CROSCROW — WA Marketing</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.27.0/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --font-family:'IBM Plex Mono',monospace;
      --bg:#060a14; --bg-card:#0a1020; --bg-card2:#0d1428; --bg-hover:#111830;
      --border:#1a2540; --border-hi:#243560;
      --indigo:#6366f1; --indigo-dim:#1e1b4b; --indigo-glow:#6366f130;
      --cyan:#22d3ee; --cyan-bg:#0d1f30;
      --green:#10b981; --green-bg:#064e3b;
      --red:#f87171; --red-bg:#2d0a0a;
      --yellow:#fbbf24; --yellow-bg:#422006;
      --orange:#fb923c; --orange-bg:#431407;
      --purple:#a78bfa; --purple-bg:#1e1b4b;
      --gray:#9ca3af; --gray-bg:#1c2230;
      --text:#e2e8f0; --text-muted:#4b6a8e; --text-dim:#7d9ab8;
    }
    html,body{background:var(--bg);color:var(--text);font-family:var(--font-family);min-height:100%}
    body{font-size:13px;-webkit-font-smoothing:antialiased}
    #root{min-height:100vh}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:4px}
    input,select{font-family:inherit}
    a{color:inherit}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
const API = '';
const ls = { get:(k,d)=>{ try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;} }, set:(k,v)=>{ try{localStorage.setItem(k,JSON.stringify(v));}catch{} } };

function fmtMoney(n) { return '₹' + Math.round(n||0).toLocaleString('en-IN'); }
function fmtPct(n) { return (n||0) + '%'; }
function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if (d > 0) return d + 'd ago';
  if (h > 0) return h + 'h ago';
  if (m > 0) return m + 'm ago';
  return 'just now';
}

const STATUS_COLORS = {
  not_sent: { c: 'var(--text-muted)', bg: 'var(--gray-bg)', label: '—' },
  sent:      { c: 'var(--gray)',   bg: 'var(--gray-bg)',   label: 'Sent' },
  delivered: { c: 'var(--cyan)',   bg: 'var(--cyan-bg)',   label: 'Delivered' },
  read:      { c: 'var(--green)',  bg: 'var(--green-bg)',  label: 'Read' },
  failed:    { c: 'var(--red)',    bg: 'var(--red-bg)',    label: 'Failed' },
};
const INTENT_STYLE = {
  '✅ Converted':             { c: 'var(--green)',  bg: 'var(--green-bg)' },
  '🔥 Hot':                   { c: 'var(--orange)',  bg: 'var(--orange-bg)' },
  '🙂 Warm':                  { c: 'var(--yellow)',  bg: 'var(--yellow-bg)' },
  '😐 Delivered, not opened': { c: 'var(--text-dim)', bg: 'var(--gray-bg)' },
  '⚠️ Undeliverable':         { c: 'var(--red)',     bg: 'var(--red-bg)' },
  '🚫 Dismissed':             { c: 'var(--text-muted)', bg: 'var(--gray-bg)' },
  '⏳ Pending':               { c: 'var(--text-muted)', bg: 'var(--gray-bg)' },
};

function StatusDot({ status }) {
  const s = STATUS_COLORS[status] || STATUS_COLORS.not_sent;
  return <span title={s.label} style={{display:'inline-block',width:9,height:9,borderRadius:'50%',background:s.c,boxShadow:status!=='not_sent'?`0 0 6px ${s.c}`:'none'}}/>;
}

function KpiCard({ label, value, sub, accent }) {
  return (
    <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'16px 18px',flex:'1 1 150px',minWidth:150}}>
      <div style={{fontSize:10,letterSpacing:1,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:8}}>{label}</div>
      <div style={{fontSize:26,fontWeight:700,color:accent||'var(--text)'}}>{value}</div>
      {sub && <div style={{fontSize:11,color:'var(--text-dim)',marginTop:4}}>{sub}</div>}
    </div>
  );
}

function FunnelCard({ title, sent, delivered, read }) {
  const dRate = sent ? Math.round(100*delivered/sent) : 0;
  const rRate = sent ? Math.round(100*read/sent) : 0;
  const Bar = ({ w, color, label, count }) => (
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:10.5,color:'var(--text-dim)',marginBottom:4}}>
        <span>{label}</span><span style={{color:'var(--text)'}}>{count}</span>
      </div>
      <div style={{height:8,background:'var(--bg-hover)',borderRadius:4,overflow:'hidden'}}>
        <div style={{height:'100%',width:w+'%',background:color,borderRadius:4,transition:'width .4s'}}/>
      </div>
    </div>
  );
  return (
    <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'16px 18px',flex:'1 1 220px'}}>
      <div style={{fontSize:11,fontWeight:600,color:'var(--text)',marginBottom:12,letterSpacing:.5}}>{title}</div>
      <Bar w={100} color="var(--indigo)" label="Sent" count={sent}/>
      <Bar w={dRate} color="var(--cyan)" label={`Delivered (${dRate}%)`} count={delivered}/>
      <Bar w={rRate} color="var(--green)" label={`Read (${rRate}%)`} count={read}/>
    </div>
  );
}

function TimeseriesChart({ data }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.Chart) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current.getContext('2d'), {
      type: 'line',
      data: {
        labels: data.map(d => d.date.slice(5)),
        datasets: [
          { label: 'Abandoned', data: data.map(d => d.abandoned), borderColor: '#6366f1', backgroundColor: '#6366f130', fill: true, tension: .3, pointRadius: 2 },
          { label: 'Recovered', data: data.map(d => d.recovered), borderColor: '#10b981', backgroundColor: '#10b98130', fill: true, tension: .3, pointRadius: 2 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#7d9ab8', font: { family: 'IBM Plex Mono', size: 10 } } } },
        scales: {
          x: { ticks: { color: '#4b6a8e', font: { size: 9 } }, grid: { color: '#1a2540' } },
          y: { ticks: { color: '#4b6a8e', font: { size: 9 } }, grid: { color: '#1a2540' }, beginAtZero: true },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [data]);
  return <div style={{height:220}}><canvas ref={ref}/></div>;
}

function OpenedDistribution({ dist }) {
  const total = Object.values(dist).reduce((a,b)=>a+b,0) || 1;
  const order = ['3','2','1','0'];
  const colors = { '3':'var(--green)', '2':'var(--cyan)', '1':'var(--yellow)', '0':'var(--text-muted)' };
  const labels = { '3':'Read all 3', '2':'Read 2 of 3', '1':'Read 1 of 3', '0':'Never opened' };
  return (
    <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'16px 18px',flex:'1 1 220px'}}>
      <div style={{fontSize:11,fontWeight:600,color:'var(--text)',marginBottom:12,letterSpacing:.5}}>Engagement Depth</div>
      {order.map(k => {
        const v = dist[k] || 0;
        const pct = Math.round(100*v/total);
        return (
          <div key={k} style={{marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:10.5,color:'var(--text-dim)',marginBottom:4}}>
              <span>{labels[k]}</span><span style={{color:'var(--text)'}}>{v} ({pct}%)</span>
            </div>
            <div style={{height:8,background:'var(--bg-hover)',borderRadius:4,overflow:'hidden'}}>
              <div style={{height:'100%',width:pct+'%',background:colors[k],borderRadius:4}}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ProductTable({ products }) {
  return (
    <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'16px 18px'}}>
      <div style={{fontSize:11,fontWeight:600,color:'var(--text)',marginBottom:14,letterSpacing:.5}}>Product-Wise Performance</div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:11.5}}>
          <thead>
            <tr style={{color:'var(--text-muted)',textAlign:'left',borderBottom:'1px solid var(--border)'}}>
              <th style={{padding:'6px 8px',fontWeight:500}}>Product</th>
              <th style={{padding:'6px 8px',fontWeight:500}}>Abandoned</th>
              <th style={{padding:'6px 8px',fontWeight:500}}>Recovered</th>
              <th style={{padding:'6px 8px',fontWeight:500}}>Recovery Rate</th>
              <th style={{padding:'6px 8px',fontWeight:500}}>Revenue Recovered</th>
            </tr>
          </thead>
          <tbody>
            {products.map((p,i) => {
              const rate = p.abandoned ? Math.round(100*p.recovered/p.abandoned) : 0;
              return (
                <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                  <td style={{padding:'8px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      {p.image_url ? <img src={p.image_url} style={{width:30,height:30,objectFit:'cover',borderRadius:4,border:'1px solid var(--border)'}}/> : <div style={{width:30,height:30,borderRadius:4,background:'var(--bg-hover)'}}/>}
                      <span style={{color:'var(--text)',maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.title}</span>
                    </div>
                  </td>
                  <td style={{padding:'8px',color:'var(--text-dim)'}}>{p.abandoned}</td>
                  <td style={{padding:'8px',color:'var(--green)'}}>{p.recovered}</td>
                  <td style={{padding:'8px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <div style={{width:50,height:6,background:'var(--bg-hover)',borderRadius:3,overflow:'hidden'}}>
                        <div style={{height:'100%',width:rate+'%',background:rate>30?'var(--green)':rate>10?'var(--yellow)':'var(--red)',borderRadius:3}}/>
                      </div>
                      <span style={{color:'var(--text-dim)',fontSize:10.5}}>{rate}%</span>
                    </div>
                  </td>
                  <td style={{padding:'8px',color:'var(--text)',fontWeight:600}}>{fmtMoney(p.revenue)}</td>
                </tr>
              );
            })}
            {!products.length && <tr><td colSpan="5" style={{padding:20,textAlign:'center',color:'var(--text-muted)'}}>No data in this range</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function CustomerRow({ c }) {
  const style = INTENT_STYLE[c.intent] || INTENT_STYLE['⏳ Pending'];
  return (
    <tr style={{borderBottom:'1px solid var(--border)'}}>
      <td style={{padding:'9px 8px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {c.item_image ? <img src={c.item_image} style={{width:32,height:32,objectFit:'cover',borderRadius:4,border:'1px solid var(--border)',flexShrink:0}}/> : <div style={{width:32,height:32,borderRadius:4,background:'var(--bg-hover)',flexShrink:0}}/>}
          <div style={{minWidth:0}}>
            <div style={{color:'var(--text)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>{c.name || 'No name'}</div>
            <div style={{color:'var(--text-muted)',fontSize:10}}>{c.phone || 'no phone'} · {timeAgo(c.received_at)}</div>
          </div>
        </div>
      </td>
      <td style={{padding:'9px 8px',color:'var(--text-dim)',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.item_title || '—'}</td>
      <td style={{padding:'9px 8px',color:'var(--text)',fontWeight:600}}>{fmtMoney(c.total)}</td>
      <td style={{padding:'9px 8px'}}>
        <div style={{display:'flex',gap:6}}>
          <StatusDot status={c.touch1}/><StatusDot status={c.touch2}/><StatusDot status={c.touch3}/>
        </div>
      </td>
      <td style={{padding:'9px 8px'}}>
        <span style={{fontSize:10,padding:'3px 8px',borderRadius:12,background:style.bg,color:style.c,whiteSpace:'nowrap'}}>{c.intent}</span>
      </td>
      <td style={{padding:'9px 8px',color:'var(--text-dim)'}}>
        {c.status === 'recovered' ? <span style={{color:'var(--green)'}}>{fmtMoney(c.recovered_amount)} · {c.recovered_order_name}</span> : '—'}
      </td>
      <td style={{padding:'9px 8px'}}>
        {c.phone && c.phone.length===10 && (
          <div style={{display:'flex',gap:6}}>
            <a href={`tel:+91${c.phone}`} style={{width:26,height:26,display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid var(--border-hi)',borderRadius:5,textDecoration:'none',color:'var(--cyan)'}}>☎</a>
            <a href={`https://wa.me/91${c.phone}`} target="_blank" style={{width:26,height:26,display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid var(--border-hi)',borderRadius:5,textDecoration:'none',color:'var(--green)'}}>✆</a>
          </div>
        )}
      </td>
    </tr>
  );
}

function App() {
  const [token, setToken] = useState(() => ls.get('admin_token', null));
  const [pw, setPw] = useState('');
  const [loginErr, setLoginErr] = useState('');
  const [days, setDays] = useState(30);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [search, setSearch] = useState('');
  const [intentFilter, setIntentFilter] = useState('all');

  function doLogin(e) {
    e.preventDefault();
    setLoginErr('');
    fetch(`${API}/admin/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) })
      .then(r => r.json()).then(d => {
        if (!d.token) { setLoginErr(d.error || 'Login failed'); return; }
        ls.set('admin_token', d.token); setToken(d.token);
      }).catch(() => setLoginErr('Network error'));
  }

  function load() {
    if (!token) return;
    setLoading(true);
    fetch(`${API}/admin/wa-marketing/overview?days=${days}`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => { if (r.status === 401) { setToken(null); throw new Error('unauth'); } return r.json(); })
      .then(d => { if (!d.error) setData(d); })
      .catch(() => {})
      .finally(() => setLoading(false));
  }
  useEffect(load, [token, days]);

  const filteredCustomers = useMemo(() => {
    if (!data) return [];
    let rows = data.customers;
    if (intentFilter !== 'all') rows = rows.filter(c => c.intent === intentFilter);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      rows = rows.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.item_title||'').toLowerCase().includes(q));
    }
    return rows;
  }, [data, search, intentFilter]);

  if (!token) {
    return (
      <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <form onSubmit={doLogin} style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:12,padding:32,width:300}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:4,color:'var(--text)'}}>CROSCROW</div>
          <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:20}}>WhatsApp Marketing — Admin Login</div>
          <input type="password" placeholder="Admin password" value={pw} onChange={e=>setPw(e.target.value)}
            style={{width:'100%',padding:'10px 12px',background:'var(--bg-hover)',border:'1px solid var(--border-hi)',borderRadius:6,color:'var(--text)',marginBottom:10,outline:'none'}}/>
          {loginErr && <div style={{color:'var(--red)',fontSize:11,marginBottom:10}}>{loginErr}</div>}
          <button type="submit" style={{width:'100%',padding:'10px',background:'var(--indigo)',border:'none',borderRadius:6,color:'#fff',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Login</button>
        </form>
      </div>
    );
  }

  const k = data?.kpis;
  const intents = ['all','✅ Converted','🔥 Hot','🙂 Warm','😐 Delivered, not opened','⚠️ Undeliverable','⏳ Pending'];

  return (
    <div style={{maxWidth:1320,margin:'0 auto',padding:'28px 20px 60px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div>
          <div style={{fontSize:20,fontWeight:800,color:'var(--text)',letterSpacing:.3}}>📲 WhatsApp Marketing</div>
          <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>Abandoned-cart recovery performance — live from your 3-touch sequence</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {[7,30,90].map(d => (
            <button key={d} onClick={()=>setDays(d)} style={{padding:'7px 14px',borderRadius:6,border:'1px solid var(--border-hi)',background:days===d?'var(--indigo)':'var(--bg-card)',color:days===d?'#fff':'var(--text-dim)',cursor:'pointer',fontSize:11,fontFamily:'inherit',fontWeight:600}}>{d}d</button>
          ))}
          <button onClick={load} style={{padding:'7px 14px',borderRadius:6,border:'1px solid var(--border-hi)',background:'var(--bg-card)',color:'var(--text-dim)',cursor:'pointer',fontSize:11,fontFamily:'inherit'}}>{loading?'…':'↻'}</button>
        </div>
      </div>

      {!data ? <div style={{color:'var(--text-muted)',padding:40,textAlign:'center'}}>Loading…</div> : (
      <>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:16}}>
          <KpiCard label="Abandoned Carts" value={k.total_abandoned} sub={`last ${days} days`}/>
          <KpiCard label="Recovered" value={k.recovered_count} sub={`${fmtPct(k.conversion_rate)} conversion`} accent="var(--green)"/>
          <KpiCard label="Revenue Recovered" value={fmtMoney(k.recovered_revenue)} sub={`avg ${fmtMoney(k.avg_recovered_order)}/order`} accent="var(--green)"/>
          <KpiCard label="Touch 1 Read Rate" value={fmtPct(k.touch1_read_rate)} sub={`${k.touch1_read} of ${k.touch1_sent} sent`} accent="var(--cyan)"/>
          <KpiCard label="Touch 2 Read Rate" value={fmtPct(k.touch2_read_rate)} sub={`${k.touch2_read} of ${k.touch2_sent} sent`} accent="var(--cyan)"/>
          <KpiCard label="Touch 3 Read Rate" value={fmtPct(k.touch3_read_rate)} sub={`${k.touch3_read} of ${k.touch3_sent} sent`} accent="var(--cyan)"/>
        </div>

        <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:16}}>
          <FunnelCard title="Touch 1 — Immediate" sent={k.touch1_sent} delivered={k.touch1_delivered} read={k.touch1_read}/>
          <FunnelCard title="Touch 2 — 24h" sent={k.touch2_sent} delivered={k.touch2_delivered} read={k.touch2_read}/>
          <FunnelCard title="Touch 3 — 48h" sent={k.touch3_sent} delivered={k.touch3_delivered} read={k.touch3_read}/>
          <OpenedDistribution dist={k.opened_distribution}/>
        </div>

        <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'16px 18px',marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:600,color:'var(--text)',marginBottom:12,letterSpacing:.5}}>Abandoned vs Recovered — Daily Trend</div>
          <TimeseriesChart data={data.timeseries}/>
        </div>

        <div style={{marginBottom:16}}>
          <ProductTable products={data.products}/>
        </div>

        <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'16px 18px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:10}}>
            <div style={{fontSize:11,fontWeight:600,color:'var(--text)',letterSpacing:.5}}>Customer List ({filteredCustomers.length})</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <select value={intentFilter} onChange={e=>setIntentFilter(e.target.value)} style={{background:'var(--bg-hover)',border:'1px solid var(--border-hi)',borderRadius:6,color:'var(--text)',padding:'6px 10px',fontSize:11,fontFamily:'inherit'}}>
                {intents.map(i => <option key={i} value={i}>{i==='all'?'All intents':i}</option>)}
              </select>
              <input placeholder="Search name, phone, product…" value={search} onChange={e=>setSearch(e.target.value)}
                style={{background:'var(--bg-hover)',border:'1px solid var(--border-hi)',borderRadius:6,color:'var(--text)',padding:'6px 10px',fontSize:11,fontFamily:'inherit',width:200}}/>
            </div>
          </div>
          <div style={{overflowX:'auto',maxHeight:560,overflowY:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11.5}}>
              <thead>
                <tr style={{color:'var(--text-muted)',textAlign:'left',borderBottom:'1px solid var(--border)',position:'sticky',top:0,background:'var(--bg-card)'}}>
                  <th style={{padding:'6px 8px',fontWeight:500}}>Customer</th>
                  <th style={{padding:'6px 8px',fontWeight:500}}>Product</th>
                  <th style={{padding:'6px 8px',fontWeight:500}}>Cart Value</th>
                  <th style={{padding:'6px 8px',fontWeight:500}}>T1 · T2 · T3</th>
                  <th style={{padding:'6px 8px',fontWeight:500}}>Intent</th>
                  <th style={{padding:'6px 8px',fontWeight:500}}>Outcome</th>
                  <th style={{padding:'6px 8px',fontWeight:500}}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filteredCustomers.slice(0, 300).map((c,i) => <CustomerRow key={i} c={c}/>)}
                {!filteredCustomers.length && <tr><td colSpan="7" style={{padding:30,textAlign:'center',color:'var(--text-muted)'}}>No customers match</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
